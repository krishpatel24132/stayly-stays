<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stayly - an Airbnb homepage clone built with React and Tailwind CSS" />
    <title>Stayly | Vacation rentals, cabins, beach houses &amp; more</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏡</text></svg>" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white
      try { var d = JSON.parse(localStorage.getItem("stayly-dark")); if (d === null ? matchMedia("(prefers-color-scheme: dark)").matches : d) document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
